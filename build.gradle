// =========================================================================
// cpp-logger build.gradle - CIAO DEFENSIVE EDITION
// =========================================================================
//
// !!! THIS FILE IS PART OF THE CIAO DEFENSIVE PROGRAMMING STYLE !!!
// !!! DO NOT SIMPLIFY, REMOVE COMMENTS, OR "CLEAN UP" THIS FILE !!!
//
// Purpose:
//   Provides Gradle build support using the cpp-application plugin.
//   Designed to work alongside build.sh and maintain full consistency
//   with the project's multi-build-system philosophy.
// Parameters:
//   none
// Dependencies:
//   PRJ from project.ini.
// Why This Design:
//   One file keeps the Gradle tasks. The product id stays in project.ini.
// CIAO Principles Applied:
//   Intentional: every function and product task has Purpose and Protection Rule.
// Protection Rule:
//   DO NOT hardcode the project name past the fallback. DO NOT remove these comments.
//
// Critical CIAO Principles Applied:
//   - Every function/task has explicit Purpose and Protection Rule
//   - Verbose documentation and loud warnings against simplification
//   - Defensive checks before any destructive or important operation
//   - Single Source of Truth via project.ini when available
//   - Resistance to AI-induced "helpful" simplifications
//
// Last reviewed & hardened: April 2026
// =========================================================================

plugins {
    id 'cpp-application'
}

def THIS_VERSION = '1.1.3'

// =========================================================================
// Target host
//
// Purpose:
//   Selects Windows, macOS, or Linux. A Linux host records glibc, uclibc, or musl.
//
// Protection Rule:
//   DO NOT reject uClibc or musl. DO NOT run pkg-config on Windows or macOS.
// =========================================================================
def osName = System.getProperty('os.name', '').toLowerCase()
def osWindows = osName.contains('windows')
def osMac = osName.contains('mac')
def osLinux = !osWindows && !osMac
def linuxLibc = ''
if (osLinux) {
    def probe = ['sh', '-c', 'if ldd --version 2>&1 | grep -qi uclibc; then echo uclibc; elif ldd --version 2>&1 | grep -qi musl; then echo musl; elif ldd --version 2>&1 | grep -qi glibc; then echo glibc; else echo glibc; fi'].execute().text.trim()
    if (probe == 'uclibc' || probe == 'musl' || probe == 'glibc') {
        linuxLibc = probe
    } else {
        linuxLibc = 'glibc'
    }
    println "[INFO] Target host: linux/${linuxLibc}"
} else if (osWindows) {
    println "[INFO] Target host: windows"
} else {
    println "[INFO] Target host: macOS"
}

// =========================================================================
// loadPropertiesFromIni(File iniFile)
// 
// Purpose:
//   Loads project configuration from project.ini as the Single Source of Truth.
//   Falls back gracefully to defaults if the file is missing or unreadable.
// Parameters:
//   iniFile
// Dependencies:
//   project.ini
// Why This Design:
//   One loader is the source of PRJ.
// CIAO Principles Applied:
//   Caution: a missing file returns an empty map.
// Protection Rule:
//   DO NOT simplify this function. DO NOT remove error handling or logging.
//   Future maintainers must preserve the defensive loading behavior.
// =========================================================================
def loadPropertiesFromIni(File iniFile) {
    if (!iniFile.exists()) {
        println "[WARN] project.ini not found at ${iniFile}. Using built-in defaults."
        return [:]
    }

    def props = new Properties()
    try {
        iniFile.withInputStream { stream ->
            props.load(stream)
        }
        println "[INFO] Successfully loaded properties from ${iniFile.name}"
    } catch (Exception e) {
        println "[ERROR] Failed to load ${iniFile.name}: ${e.message}. Using defaults."
        return [:]
    }
    return props
}

// Define properties file
def iniFile = file("${projectDir}/project.ini")
def projectProps = loadPropertiesFromIni(iniFile)

// =========================================================================
// Project variables with safe defaults (CIAO defensive)
// 
// Purpose:
//   Centralizes all configurable project settings with fallback values.
// Parameters:
//   none
// Dependencies:
//   loadPropertiesFromIni
// Why This Design:
//   Later tasks read these variables.
// CIAO Principles Applied:
//   Intentional: the fallback name is the only product-id default.
// Protection Rule:
//   DO NOT hardcode values elsewhere in this file. Always use these variables.
// =========================================================================
def PRJ             = projectProps['PRJ']             ?: 'cpp-logger'
def SRC             = projectProps['SRC']             ?: 'src'
def BUILD           = projectProps['BUILD']           ?: 'target'
def VERSION         = projectProps['VERSION']         ?: '1.0.0'
def AUTHOR          = projectProps['AUTHOR']          ?: 'you@example.com'
def REQUIRED_PACKAGES = projectProps['REQUIRED_PACKAGES'] ?: ''
def AVOIDED_PACKAGES  = projectProps['AVOIDED_PACKAGES']  ?: ''

def LIB_VERSIONS    = (projectProps['LIB_VERSIONS'] ?: 'glib-2.0').split(/\s+/).findAll { it.trim() }
def SRC_C           = "${SRC}/main/c"
def SRC_CPP         = "${SRC}/main/cpp"
def BUILD_DEBUG     = "${BUILD}/exe/debug"

def cDir            = file(SRC_C)
def cppDir          = file(SRC_CPP)
def mainCppFile     = file("${SRC_CPP}/main.cpp")

if (cDir.isDirectory()) {
    println "[INFO] Check ${SRC_C}: present"
} else {
    println "[INFO] Check ${SRC_C}: absent. Contributes no files."
}
if (cppDir.isDirectory()) {
    println "[INFO] Check ${SRC_CPP}: present"
} else {
    println "[INFO] Check ${SRC_CPP}: absent. Contributes no files."
}

// =========================================================================
// runCommand(String command)
// 
// Purpose:
//   Safely executes shell commands with proper logging and error handling.
//   Used for pkg-config, autoreconf, make, etc.
// Parameters:
//   command
// Dependencies:
//   The host shell.
// Why This Design:
//   One function is the command execution point.
// CIAO Principles Applied:
//   Caution: a failed command is logged and does not throw.
// Protection Rule:
//   DO NOT replace this with direct .execute() calls.
//   DO NOT remove logging or exception handling. This is the central
//   command execution point for Gradle tasks.
// =========================================================================
def runCommand(String command) {
    println "[INFO] Executing: ${command}"
    try {
        def process = command.execute()
        def output = process.text.trim()
        def exitCode = process.waitFor()

        if (exitCode != 0) {
            println "[WARN] Command failed (exit ${exitCode}): ${command}"
            if (!output.isEmpty()) println "[WARN] Output: ${output}"
        } else if (!output.isEmpty()) {
            println "[INFO] Command output: ${output}"
        }
        return output
    } catch (Exception e) {
        println "[ERROR] Failed to execute: ${command}"
        println "[ERROR] Exception: ${e.message}"
        return ""
    }
}

// =========================================================================
// pkg-config handling (defensive)
// 
// Purpose:
//   Retrieves compiler and linker flags using pkg-config for the libraries in project.ini.
// Parameters:
//   none
// Dependencies:
//   LIB_VERSIONS from project.ini. Linux only.
// Why This Design:
//   Compile receives --cflags. Link receives --libs.
// CIAO Principles Applied:
//   Caution: Windows and macOS skip these two commands.
// Protection Rule:
//   DO NOT hardcode flags. Always use pkg-config output. DO NOT join --cflags and --libs in one command.
// =========================================================================
def pkgCflags = ""
def pkgLibs = ""
if (osLinux && !LIB_VERSIONS.isEmpty()) {
    def modules = LIB_VERSIONS.join(' ')
    pkgCflags = runCommand("pkg-config --cflags ${modules}")
    pkgLibs = runCommand("pkg-config --libs ${modules}")
    if (pkgCflags.isEmpty() && pkgLibs.isEmpty()) {
        println "[WARN] pkg-config returned no output. Development packages may be missing."
    }
}

def gccCompilerArgs = ["-x", "c", "-std=c11", "-Wall", "-Wextra", "-g", "-O2"] +
                      pkgCflags.split(/\s+/).findAll { it.startsWith('-') }

def gppCompilerArgs = ["-x", "c++", "-std=c++17", "-Wall", "-Wextra", "-g", "-O2"] +
                      pkgCflags.split(/\s+/).findAll { it.startsWith('-') }

def gccLinkerArgs = ["-Wl,--export-dynamic", "-pthread"] +
                    pkgLibs.split(/\s+/).findAll { it.startsWith('-') }

def gppLinkerArgs = ["-Wl,--export-dynamic", "-pthread"] +
                    pkgLibs.split(/\s+/).findAll { it.startsWith('-') }

// =========================================================================
// Application configuration block
// 
// Purpose:
//   Configures the cpp-application plugin for C/C++ compilation and linking.
//   CppCompile adds -std=c++17 -Wall -Wextra -g -O2.
//   linkDebug writes target/exe/debug/${PRJ}.
// Parameters:
//   none
// Dependencies:
//   pkg-config --cflags and pkg-config --libs on Linux.
// Why This Design:
//   The debug binary path matches the Ant and Meson output.
// CIAO Principles Applied:
//   Anti-fragile: a missing src/main/c contributes no files.
// Protection Rule:
//   DO NOT remove the output directory creation or binary name override.
//   This must stay consistent with build.sh and meson build.
// =========================================================================
application {
    binaries.configureEach { binary ->
        def compileTask = binary.compileTask.get()
        def linkTask = binary.linkTask.get()

        if (!osLinux) {
            compileTask.enabled = false
            linkTask.enabled = false
        }

        if (mainCppFile.exists()) {
            println "[INFO] C++ source detected → using C++ mode"
            compileTask.source.from fileTree(dir: SRC_CPP, include: '**/*.cpp')
            compileTask.compilerArgs = gppCompilerArgs
            linkTask.linkerArgs = gppLinkerArgs
        } else if (cDir.isDirectory()) {
            println "[INFO] C source detected → using C mode"
            compileTask.source.from fileTree(dir: SRC_C, include: '**/*.c')
            compileTask.compilerArgs = gccCompilerArgs
            linkTask.linkerArgs = gccLinkerArgs
        } else {
            println "[WARN] Check ${SRC_C}: absent. Check ${SRC_CPP}: no main.cpp. No sources."
            compileTask.enabled = false
            linkTask.enabled = false
        }

        // Defensive output directory creation
        def buildDebugDir = file(BUILD_DEBUG)
        if (!buildDebugDir.exists()) {
            if (buildDebugDir.mkdirs()) {
                println "[OK] Created output directory: ${BUILD_DEBUG}"
            } else {
                println "[WARN] Failed to create directory: ${BUILD_DEBUG}"
            }
        }

        // Force consistent binary output location
        linkTask.linkerArgs.addAll(['-o', "${BUILD_DEBUG}/${PRJ}"])
    }
}

// =========================================================================
// scriptVersion task
// 
// Purpose:
//   Prints the Gradle script version and the project name.
// Parameters:
//   none
// Dependencies:
//   PRJ from project.ini, and the script version in this file.
// Why This Design:
//   One task prints the version so other tasks do not invent a second print.
// CIAO Principles Applied:
//   Intentional: the version string is visible before a build.
// Protection Rule:
//   DO NOT remove this task. It is used by other tasks for consistency.
// =========================================================================
task scriptVersion {
    group = 'help'
    description = 'Print the Gradle script version and the project name'
    doLast {
        println "Gradle build script version: ${THIS_VERSION}"
        println "Project: ${PRJ} v${VERSION}"
    }
}

// =========================================================================
// installDependencies task
// 
// Purpose:
//   Generates project.sh when it is absent, then runs it.
// Parameters:
//   none
// Dependencies:
//   PRJ, SRC, and LIB_VERSIONS. assemble and run do not depend on this task.
// Why This Design:
//   An existing project.sh stays as it is.
// CIAO Principles Applied:
//   Caution: this task is not a dependency of assemble.
// Protection Rule:
//   DO NOT simplify the generated script content. It must remain as robust
//   as the main build.sh. Never remove the apt_install/apt_uninstall logic.
// =========================================================================
task installDependencies {
    group = 'build'
    description = 'Generate project.sh when it is absent, then run it'
    def scriptFile = file("${projectDir}/project.sh")

    doLast {
        if (!scriptFile.exists()) {
            println "[INFO] project.sh not found. Generating CIAO-defensive version..."

            def libs = LIB_VERSIONS.join(' ')

            scriptFile.text = """#!/bin/sh
# =========================================================================
# Auto-generated project.sh (CIAO defensive)
# Do NOT simplify or remove any part of this script.
# =========================================================================

export PRJ=${PRJ}
export SRC=${SRC}
export SRC_C=\$SRC/main/cpp
export SRC_CPP=\$SRC/main/cpp
export BUILD=${BUILD}
export BUILD_DEBUG=\$BUILD/exe/debug
export REQUIRED_LIBS="${libs}"

REQUIRED_PACKAGES="${REQUIRED_PACKAGES}"
AVOIDED_PACKAGES="${AVOIDED_PACKAGES}"

apt_install() {
  if ! apt list --installed 2>/dev/null | grep -q "^\$2/"; then
    if [ "\$1" -eq 0 ]; then
      sudo apt update -qq || true
    fi
    sudo apt install -y -qq "\$2" && echo "1" || echo "0"
  else
    echo "\$1"
  fi
}

apt_uninstall() {
  if apt list --installed 2>/dev/null | grep -q "^\$1/"; then
    sudo apt purge --autoremove -y -qq "\$1" || true
  fi
}

install() {
  UPD=0
  echo "\$REQUIRED_PACKAGES" | tr ' ' '\\n' | while read -r package; do
    [ -z "\$package" ] && continue
    UPD=\$(apt_install \$UPD "\$package")
  done

  echo "\$AVOIDED_PACKAGES" | tr ' ' '\\n' | while read -r package; do
    [ -z "\$package" ] && continue
    apt_uninstall "\$package"
  done
}

install
"""

            scriptFile.setExecutable(true)
            println "[OK] Generated defensive project.sh"
        }

        println "[INFO] Running dependency installation via project.sh..."
        exec {
            commandLine 'sh', scriptFile.absolutePath
        }
    }

    outputs.file(scriptFile)
}

// =========================================================================
// buildWindows
//
// Purpose:
//   Windows target host. A Linux host skips this task.
// Parameters:
//   none
// Dependencies:
//   osWindows. This task skips pkg-config.
// Why This Design:
//   assemble depends on this task only on Windows.
// CIAO Principles Applied:
//   Caution: a Linux host does not run this task.
// Protection Rule:
//   DO NOT run pkg-config here. DO NOT reject this host.
// =========================================================================
tasks.register('buildWindows') {
    group = 'build'
    description = 'Windows target host. A Linux host skips this task'
    onlyIf { osWindows }
    doLast {
        println "[INFO] Windows target host. Debug binary: ${BUILD_DEBUG}/${PRJ}"
    }
}

// =========================================================================
// buildMac
//
// Purpose:
//   macOS target host. A Linux host skips this task.
// Parameters:
//   none
// Dependencies:
//   osMac. This task skips pkg-config.
// Why This Design:
//   assemble depends on this task only on macOS.
// CIAO Principles Applied:
//   Caution: a Linux host does not run this task.
// Protection Rule:
//   DO NOT run pkg-config here. DO NOT reject this host.
// =========================================================================
tasks.register('buildMac') {
    group = 'build'
    description = 'macOS target host. A Linux host skips this task'
    onlyIf { osMac }
    doLast {
        println "[INFO] macOS target host. Debug binary: ${BUILD_DEBUG}/${PRJ}"
    }
}

// =========================================================================
// run
//
// Purpose:
//   Assembles the debug binary and executes target/exe/debug/${PRJ}.
// Parameters:
//   none
// Dependencies:
//   assemble
// Why This Design:
//   The binary matches the sources before it starts.
// CIAO Principles Applied:
//   Anti-fragile: run depends on assemble.
// Protection Rule:
//   DO NOT remove the assemble dependency. DO NOT hardcode the project name.
// =========================================================================
if (tasks.findByName('run') == null) {
    tasks.register('run') {
        group = 'application'
        description = 'Assemble the debug binary and execute target/exe/debug/${PRJ}'
        dependsOn 'assemble'
        doLast {
            exec {
                commandLine "${BUILD_DEBUG}/${PRJ}"
            }
        }
    }
} else {
    tasks.named('run').configure {
        dependsOn 'assemble'
    }
}

if (osWindows) {
    tasks.named('assemble').configure {
        dependsOn 'buildWindows'
    }
}
if (osMac) {
    tasks.named('assemble').configure {
        dependsOn 'buildMac'
    }
}

println "[CIAO] Gradle build script loaded successfully for ${PRJ} (defensive mode)"